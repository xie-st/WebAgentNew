{{- if .Values.secrets -}}
{{- $hasSecrets := false -}}
{{- range .Values.secrets -}}
  {{- if . -}}{{- $hasSecrets = true -}}{{- end -}}
{{- end -}}
{{- if $hasSecrets -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "effgen.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "effgen.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
