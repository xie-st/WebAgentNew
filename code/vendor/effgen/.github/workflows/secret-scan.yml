name: Secret Scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    # Run nightly at 02:00 UTC to catch any drift
    - cron: "0 2 * * *"

jobs:
  gitleaks:
    name: Detect Hardcoded Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for git-history scan

      # Step 1: Git history scan using the official gitleaks action
      - name: Run gitleaks (git history scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        with:
          config: .gitleaks.toml
          args: >-
            --verbose
            --redact
            --exit-code=1

      # Step 2: Full filesystem scan (catches non-git files too)
      - name: Install gitleaks binary
        run: |
          GITLEAKS_VERSION="8.30.1"
          wget -q "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -O /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin/ gitleaks
          gitleaks version

      - name: Run gitleaks dir scan
        run: |
          gitleaks dir . \
            --config .gitleaks.toml \
            --report-format json \
            --report-path gitleaks-report.json \
            --exit-code 1 \
            --redact \
            --verbose
        continue-on-error: false

      - name: Upload gitleaks report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 30
