name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"  # 2 AM UTC daily
  workflow_dispatch:  # Allow manual trigger

# Opt into Node.js 24 for all actions (Node 20 is deprecated Sep 2026).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  full-test:
    name: Full Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify critical imports
        run: |
          python -c "
          import effgen; print(f'effgen {effgen.__version__}')
          from effgen.guardrails import GuardrailChain
          from effgen.rag import DocumentIngester
          from effgen.eval import AgentEvaluator
          from effgen.domains import TechDomain
          from effgen.cache import PromptCache
          print('All imports OK')
          "

      - name: Run all unit tests
        run: |
          pytest tests/unit/ -v --cov=effgen --cov-report=xml \
            --tb=short --no-header

      - name: Run integration tests (non-GPU)
        run: |
          pytest tests/integration/ -v -m "not gpu and not docker" \
            --tb=short --no-header || true

      - name: Run e2e tests (non-GPU)
        run: |
          pytest tests/e2e/ -v -m "not gpu" \
            --tb=short --no-header || true

      - name: Run performance benchmarks
        run: |
          pytest tests/benchmarks/ -v --tb=short --no-header || true

  eval-regression:
    name: Eval Regression Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,groq]"

      - name: Run eval suite with Groq openai/gpt-oss-20b
        id: eval
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          # Migrated off the Cerebras free tier (issues #41 / #42): the
          # llama3.1-8b RPM cap was tightened upstream and the eval collapsed
          # to ~0.4 accuracy with empty 429 responses. Groq's
          # openai/gpt-oss-20b scores >=0.85 on the free tier, but that tier
          # meters tokens per minute, so the script paces the cases and does
          # not score a case the provider refused.
          python scripts/ci_eval_regression.py --version ci-nightly
      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: |
            regression-report.md
            eval-summary.json
            eval-status.txt

      - name: Open issue on regression or crash
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const status = fs.existsSync('eval-status.txt')
              ? fs.readFileSync('eval-status.txt', 'utf8').trim()
              : 'crashed';
            const body = fs.existsSync('regression-report.md')
              ? fs.readFileSync('regression-report.md', 'utf8')
              : 'Eval failed but no report file produced.';
            // Distinguish a real metric regression from an infrastructure
            // crash (rate-limit, network, auth, etc.). The latter should not
            // be filed as a "regression" — it is a test infra failure.
            const date = new Date().toISOString().slice(0,10);
            let title, labels;
            if (status === 'regression') {
              title = `Nightly eval regression detected (${date})`;
              labels = ['regression', 'automated'];
            } else {
              title = `Nightly eval test failed: infrastructure error (${date})`;
              labels = ['ci-failure', 'automated'];
            }
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels,
              });
            } catch (e) {
              core.warning(`Could not open issue (likely permissions): ${e.message}`);
            }

  # ------------------------------------------------------------------ #
  # Real-model streaming smoke test (Cerebras gpt-oss-120b)            #
  # ------------------------------------------------------------------ #
  cerebras-streaming-smoke:
    name: Cerebras Streaming Smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[cerebras]"
      - name: Stream smoke test
        id: stream
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          # A refusal (402 no credit, 401/403 key, 404 model) is printed as
          # NOT MEASURED with a warning and passes: it says nothing about effGen.
          # Only a call the provider accepted and effGen got wrong fails here.
          python scripts/ci_provider_smoke.py --provider cerebras --model gpt-oss-120b --checks stream
      - name: Open issue on streaming failure
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Cerebras streaming smoke failure (${new Date().toISOString().slice(0,10)})`,
              body: "Nightly streaming smoke failed for Cerebras gpt-oss-120b on a call the provider accepted (a refusal such as 402/401/404 is reported as not measured and opens no issue). Retried five times with backoff before failing. Check the workflow logs.",
              labels: ["bug", "cerebras", "automated"],
            });

  # ------------------------------------------------------------------ #
  # Real-model tool-calling smoke test (Cerebras gpt-oss-120b)         #
  # ------------------------------------------------------------------ #
  cerebras-tools-smoke:
    name: Cerebras Tools Smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[cerebras]"
      - name: Tools smoke test
        id: tools
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          # A refusal (402 no credit, 401/403 key, 404 model) is printed as
          # NOT MEASURED with a warning and passes: it says nothing about effGen.
          # Only a call the provider accepted and effGen got wrong fails here.
          python scripts/ci_provider_smoke.py --provider cerebras --model gpt-oss-120b --checks tools
      - name: Open issue on tool-calling failure
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Cerebras tool-calling smoke failure (${new Date().toISOString().slice(0,10)})`,
              body: "Nightly tool-calling smoke failed for Cerebras gpt-oss-120b on a call the provider accepted: Calculator+Agent did not return 144 for 12*12 (a refusal such as 402/401/404 is reported as not measured and opens no issue). Check the workflow logs.",
              labels: ["bug", "cerebras", "automated"],
            });

  # ------------------------------------------------------------------ #
  # Real-model reasoning test (Cerebras gpt-oss-120b)                  #
  # ------------------------------------------------------------------ #
  cerebras-reasoning-smoke:
    name: Cerebras Reasoning Smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[cerebras]"
      - name: Reasoning smoke test
        id: reason
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          # A refusal (402 no credit, 401/403 key, 404 model) is printed as
          # NOT MEASURED with a warning and passes: it says nothing about effGen.
          # Only a call the provider accepted and effGen got wrong fails here.
          python scripts/ci_provider_smoke.py --provider cerebras --model gpt-oss-120b --checks reasoning
      - name: Open issue on reasoning failure
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Cerebras reasoning smoke failure (${new Date().toISOString().slice(0,10)})`,
              body: "Nightly reasoning smoke: Cerebras gpt-oss-120b answered a basic yes/no logic question wrongly on a call the provider accepted, after five retries with backoff (a refusal such as 402/401/404 is reported as not measured and opens no issue). Check the workflow logs.",
              labels: ["bug", "cerebras", "automated"],
            });

  # ------------------------------------------------------------------ #
  # gpu-tests (self-hosted GPU runner, optional)                        #
  # ------------------------------------------------------------------ #
  # gpu-tests:
