schema_version: webagent.config.v1
profile: official
backend: official
runtime_dir: runtime

agent:
  strategy: single
  tool_calling_mode: react
  max_iterations: null
  capability_probe: false
  sub_agents: false
  fallback: false
  speculative_execution: false
  cross_task_memory: false

model:
  provider: official
  name: platform-unified
  context_length: 32768
  tokenizer: tiktoken:cl100k_base
  token_count_source: estimated
  # The frozen SDK supplies the actual transport; no endpoint or key is stored here.
  base_url_env: null
  api_key_env: null

budget:
  input_tokens: 24000
  planned_context_tokens: 32768
  max_model_calls: null

limits:
  max_messages: 256
  max_request_bytes: 1048576

logging:
  level: INFO
  redact_extra: []
