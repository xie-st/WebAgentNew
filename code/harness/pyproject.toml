[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "webagent"
version = "0.1.0"
description = "WebAgentNew phase-1 harness: immutable protocol, session lifecycle, tools, budget and evidence."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "effgen==1.3.0",
    "PyYAML>=6.0",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
# Default real browser backend. Install with: uv pip install -e ".[real]"
real = [
    "playwright==1.64.1",
]
# B03 trial only. browser-use 0.11.0 pins aiohttp==3.12.15 while vendored
# EffGen requires aiohttp>=3.14.3, so the two cannot share one resolved
# environment. See README and docs/.../B1.md before installing this extra.
browser-use = [
    "browser-use==0.11.0",
]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
webagent = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
timeout = 120
