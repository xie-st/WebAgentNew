    </rect>
    <text x="734" y="390" font-family="'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.5"
          font-weight="700" fill="#E8ECFF">Local engines · 4</text>
    <text x="734" y="418" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#8892b8">transformers · vllm</text><text x="734" y="439" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#8892b8">gguf · mlx (Apple)</text><text x="734" y="460" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#8892b8">weights stay on device</text>
  </g>
  <g>
    <rect x="1050" y="208" width="182" height="140" rx="14"
          fill="#0a0f22" stroke="#4ECDC4" stroke-opacity="0.5" stroke-width="1.4"/>
    <rect x="1050" y="208" width="182" height="3" rx="1.5" fill="#4ECDC4" opacity="0.9"/>
