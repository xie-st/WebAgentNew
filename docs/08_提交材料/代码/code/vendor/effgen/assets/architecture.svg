      <animate attributeName="stroke-opacity" values="0.05;0.4;0.05"
               dur="4s" begin="3.0s" repeatCount="indefinite"/>
    </rect>
    <text x="1070" y="242" font-family="'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.5"
          font-weight="700" fill="#E8ECFF">Result</text>
    <text x="1070" y="270" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#8892b8">.text</text><text x="1070" y="291" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#8892b8">.tool_calls</text><text x="1070" y="312" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#8892b8">.cost_usd</text><text x="1070" y="333" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#8892b8">.sources</text>
  </g><path d="M306 155 L356 155" stroke="#4ECDC4" stroke-width="2" fill="none" opacity="0.75" marker-end="url(#ar)" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" values="28;0" dur="1.4s" begin="0.0s" repeatCount="indefinite"/></path><path d="M660 120 L710 120" stroke="#FF6B6B" stroke-width="2" fill="none" opacity="0.75" marker-end="url(#ar)" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" values="28;0" dur="1.4s" begin="0.2s" repeatCount="indefinite"/></path><path d="M662 175 L710 250" stroke="#4CAF50" stroke-width="2" fill="none" opacity="0.75" marker-end="url(#ar)" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" values="28;0" dur="1.4s" begin="0.4s" repeatCount="indefinite"/></path><path d="M662 215 L710 392" stroke="#6C63FF" stroke-width="2" fill="none" opacity="0.75" marker-end="url(#ar)" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" values="28;0" dur="1.4s" begin="0.6s" repeatCount="indefinite"/></path><path d="M510 250 L510 288" stroke="#F5A623" stroke-width="2" fill="none" opacity="0.75" marker-end="url(#ar)" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" values="28;0" dur="1.4s" begin="0.8s" repeatCount="indefinite"/></path><path d="M1014 267 L1046 267" stroke="#4ECDC4" stroke-width="2" fill="none" opacity="0.75" marker-end="url(#ar)" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" values="28;0" dur="1.4s" begin="1.0s" repeatCount="indefinite"/></path>

  <text x="56" y="556" font-family="'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#E8ECFF">The 1.0.0 additions</text>
  <g font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#8892b8">
    <text x="56" y="584">base_url= — drive a server you already run, instead of loading a second copy of the weights</text>
    <text x="56" y="606">tool_calls — the calls a run made, with arguments, results and timings, not just a count</text>
    <text x="56" y="628">middleware= · session= · compaction= — extend the loop without patching the framework</text>
  </g>
</svg>
