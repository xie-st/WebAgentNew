{% set name = "effgen" %}
{# Source the version from the package's single source of truth
   (effgen/__init__.py, which pyproject.toml's dynamic version also reads).
   setup.py is a metadata-free PEP 621 shim, so load_setup_py_data() would
   yield no version and silently package 0.0.0 — read the literal instead. #}
{% set version_match = load_file_regex(load_file="../effgen/__init__.py",
       regex_pattern="__version__\\s*=\\s*['\"]([^'\"]+)['\"]",
       from_recipe_dir=True) %}
{% set version = version_match.group(1) %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps -vv
  entry_points:
    - effgen = effgen.cli:main
    - effgen-agent = effgen.cli:agent_main

# NOTE: conda packaging is community / best-effort; pip is the canonical install
# (see docs/installation.md). The `run:` list below mirrors the import-critical
# core of pyproject.toml's [project.dependencies] (conda-forge package names —
# e.g. pytorch, not torch). tests/packaging/test_recipe_and_workflows.py asserts
# these stay aligned with pyproject so the recipe cannot silently drift again.
requirements:
  host:
    - python >=3.11
    - pip
    - setuptools >=69.0.0
    - wheel >=0.42.0
  run:
    - python >=3.11
    - pytorch >=2.0.0
    - transformers >=4.35.0
    - accelerate >=0.24.0
    - safetensors >=0.4.0
    - sentencepiece >=0.1.99
    - protobuf >=5.29.5
    - openai >=1.3.0
    - pyyaml >=6.0.1
    - jsonschema >=4.19.0
    - python-dotenv >=1.0.0
    - requests >=2.31.0
    - aiohttp >=3.14.0
    - httpx >=0.25.0
    - numpy >=1.24.0,<3
    - pandas >=2.0.0,<4
    - pydantic >=2.0.0
    - tqdm >=4.66.0
    - rich >=13.7.0
    - click >=8.1.0
    - jinja2 >=3.1.0
    - psutil >=5.9.0
    - tiktoken >=0.5.0
    - cryptography >=41.0.0

test:
  imports:
    - effgen
    - effgen.core.agent
    - effgen.tools
    - effgen.presets

about:
  home: https://effgen.org
  license: Apache-2.0
  license_file: LICENSE
  summary: Agentic AI framework optimized for Small Language Models
  dev_url: https://github.com/ctrl-gaurav/effGen

extra:
  recipe-maintainers:
    - ctrl-gaurav
