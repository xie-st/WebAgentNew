# Tests that can fail for a reason this tree does not control.
#
# A suite that is re-run until it goes green teaches nobody anything. Everything that
# has ever failed for a reason outside the code is written down here instead, once,
# with what the cause actually was.
#
# The register is read by two things:
#
#   * `scripts/run_order_matrix.py`, which drives the whole suite over several
#     collection orders. A failure listed here is reported as a known cause and
#     re-run once; a failure that is not listed fails the run.
#   * `tests/unit/test_flake_register.py`, which fails if an entry is missing a
#     field, gives a reason too short to explain anything, names an owner that is not
#     a path in this repository, names a test that no longer exists, or has sat past
#     its expiry date.
#
# Fields, all required:
#
#   id          the pytest node id, from the repository root. A module path with no
#               `::` covers every test in that module.
#   cause       one of: external-service, host-resource, artifact-cache, timing
#   reason      what was actually observed and why the tree cannot prevent it.
#               At least 40 characters — a label is not a reason.
#   owner       the path in this repository that has to deal with the cause. Not a
#               person: the code that would change if the cause were addressed.
#   first_seen  ISO-8601 date the failure was first recorded.
#   expires     ISO-8601 date the entry stops being an answer. On that date the gate
#               fails until somebody re-measures the cause and either renews the
#               entry with what they saw or deletes it.
#
# Adding an entry is the last resort. A test that fails because of something the tree
# *does* control is a defect and is fixed.

[[flake]]
id = "tests/security/test_vuln_audit.py"
cause = "host-resource"
reason = """A dependency advisory published against a version installed in the \
environment fails this module without any change to the tree: it reads the \
installed distributions rather than the declarations, so a new CVE lands as a \
failure on an untouched checkout. The fix is a floor raised beside the parent that \
pulls the package in, plus regenerated lockfiles — a dependency change, not a \
source change."""
owner = "pyproject.toml"
first_seen = "2026-07-27"
expires = "2027-01-31"

