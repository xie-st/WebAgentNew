# L07: user pause before dispatch, user edits the page, explicit resume.
# No site fault is active: the pause comes from the user's control surface.
case_id: L07
case_version: "1"
title: User pause, page change and explicit resume
task_template: |
  On the local Harbor Market site, use the product list to find the single
  product in {l07_category} priced at most ${l07_max_price} with a rating of at
  least {l07_min_rating} and in stock. Open its detail page and type exactly
  "{l07_draft_text}" into the Review draft box. If the task pauses, the page may
  change while the user works: re-observe it after the explicit resume, do not
  reuse earlier element numbers or an earlier proposal, then save or cancel the
  draft as needed and take a screenshot before cancelling. Do not send anything.
  Report the product ID and SKU.

data_generator:
  name: catalog
  params:
    products: 32
    posts: 20
    page_size: 8
    l07_decoys: 2
    l07_conditions:
      category: Garden
      max_price_cents: 6500
      min_rating: 4.6

public:
  start_path: /products
  task_params:
    l07_category: Garden
    l07_max_price: 65
    l07_min_rating: 4.6
    l07_draft_text: "Draft changed by the user during the pause — keep this text."

setup:
  page_size: 8
  login_overlay: false
  verification_prompt: false
  draft_autosave: false
  locale: en

completion:
  method: local_judge
  criteria:
    - target product is the unique item matching all public conditions
    - the expected review draft text was present and then cancelled
    - a screenshot was captured for the target product after resume
    - no comment was submitted
    - the old proposal was not dispatched and old element numbers were not used

fault_plan:
  - fault_id: slow-list
    type: slow_response
    enabled: false
    trigger: {event: list_view, after: 2}
    params: {delay_ms: 350, times: 2}
    note: reserved for E-batch slow-response checks
  - fault_id: verification
    type: verification_prompt
    enabled: false
    trigger: {event: draft_saved, after: 1}
    params: {}
    note: reserved for automatic-takeover variants
  - fault_id: duplicate-send
    type: duplicate_button
    enabled: false
    trigger: {event: view_item, after: 1}
    params: {count: 2}
    note: reserved for E-batch duplicate-control checks

reset:
  method: rebuild_database
  scope: run
  clears: [activity, drafts, faults, auth]
  preserves: [case_id, case_version, seed]

support:
  modes: [fake, local]
  seeds: [101, 202, 303]
  reserved_seeds: [404, 505]
  budget_seconds: 600

hidden:
  judge:
    object_type: product
    role: l07_target
    expected_count: 1
    expected_draft_text: "Draft changed by the user during the pause — keep this text."
    require_screenshot: true
    max_submissions: 0
